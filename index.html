<style>
 
html {
        height: 100%;
        width: 100%;
}
 
body {
        margin: 0;
        background-image: linear-gradient(to bottom right, #2ef1ff, rgb(238, 102, 204));
        background-image: linear-gradient(to bottom right, #98f8ff, rgb(132, 87, 255));
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        width: 100%;
        flex-flow: row;
        /* background: radial-gradient(circle at top left,transparent 9%, #ffcaf7 10% ,#ffcaf7 15% , transparent 16%) , radial-gradient(circle at bottom left,transparent 9%, #ffcaf7 10% ,#ffcaf7 15% , transparent 16%), radial-gradient(circle at top right ,transparent 9%, #ffcaf7 10% ,#ffcaf7 15% , transparent 16%) , radial-gradient(circle at bottom right,transparent 9%, #ffcaf7 10% ,#ffcaf7 15% , transparent 16%),radial-gradient(circle, transparent 25%, #ffffff  26%),linear-gradient(45deg, transparent 46%, #ffcaf7 47%, #ffcaf7 52%, transparent 53%), linear-gradient(135deg, transparent 46%, #ffcaf7 47%, #ffcaf7 52%, transparent 53%);
        background-size: 3em 3em;
        background-color: #ffffff;
        opacity: 1;
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden; */
}
 
 
.button {
        border: none;
        color: white;
        /* padding: 50px 50px; */
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        /* margin: 50px 100px; */
        cursor: pointer;
        border-radius: 10px;
        height: 150px;
        width: 150px;
        position: relative;
        animation: clickbutton 1s linear;
        background-color: #c738ff54;
        
}
  
.circle {
        top: 50%;
        left: 50%       ;
        height: 100px;
        width: 100px;
        border-radius: 50%;
        position: absolute;
        transform: translate(-50%, -50%);
        border: 13px solid blueviolet;
}
 
 
.cross {
        position: absolute;
        width: 60px; /* Adjust the size as needed */
        height: 60px; /* Adjust the size as needed */
        /* display: flex;
        justify-content: center; */
        /* align-items: center; */
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
}
 
.cross::before, .cross::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 11px; /* Adjust the thickness as needed */
        height: 120px; /* Adjust the height as needed */
        background-color: rgb(201, 0, 0); /* Adjust the color as needed */
}
.cross::before {transform: translate(-50%, -50%) rotate(45deg);}
.cross::after {transform: translate(-50%, -50%) rotate(-45deg);}
 

.line {
  height: 20px;
  background: rgb(255, 32, 32);
  z-index: 1;
  position: absolute;
  width: 20px;
  top: inherit;
  left: inherit;
} 

.statsscreen{
    height: 60%;
    width: 20%;
    position: absolute;
    top: 5%;
    right: 2.5%;
    /* transform: translate(-50%); */
    background-color: #e0d9ffa8;
    visibility: visible;
    font-size: 1.8rem;
    z-index: 1;
    color: white;
    padding: 1rem 1rem;
    border-radius: 8px;
    align-content: center;
    justify-content: center;
    text-align: center;
    cursor: grab;
}

#progressbar1{
        position: absolute;
        bottom: 1rem;
        left: 1rem;
        height: 20rem;
        width: 5rem;
        background-color: burlywood;
        overflow: hidden;
}

#progressbar2{
        position: absolute;
        bottom: 1rem;
        right: 1rem;
        height: 20rem;
        width: 5rem;
        background-color: burlywood;
}


#progress1{
        position: absolute;
        width: inherit;
        height: 0%;
        bottom: 0px;
        right: inherit;
        background-color: #2ef1ff;
}

#progress2{
        position: absolute;
        width: inherit;
        height: 0%;
        bottom: 0px;
        left: inherit;
        background-color: #2ef1ff;
}

#winscreen {
        height: 20%;
        width: 20%;
        position: absolute;
        top: 16%;
        left: 2.5%;
        /* transform: translate(-50%); */
        background-color: #a793ffd8;
        visibility: hidden;
        font-size: 1.8rem;
        z-index: 2;
        color: rgb(36, 36, 36);
        padding: 1rem 1rem;
        border-radius: 8px;
        align-content: center;
        justify-content: center;
        text-align: center;
}

#countdown {
        font-size: 2rem;
}

.counter {
        text-align: center;
        align-items: center;
        align-self: center;
        justify-content: center;
        justify-self: center;
        top: 40%;
        position: relative;
        z-index: 3;
        font-family: monospace;
}

.menublur {
        /* background-color: white; */
        position: absolute;
        top: 0px;
        left: 0px;
        width: 100%;
        height: 100%;
        background: rgba(39, 39, 39, 0.1);
        backdrop-filter: blur(5px);
        z-index: 2;
}

.popupstyle {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    height: 37rem;
    width: 55rem;
    background-color: #e7b2ff31;
    border-radius: 1rem;
    box-shadow: 0 1rem 2rem hsla(0, 0%, 0%, 0.336);
    backdrop-filter: blur(5px);
    z-index: 3;
}

.popupstyle.slideleft {
        animation-name: slide;
        animation-duration: 1s;
        /* animation-fill-mode: forwards ; */
}


@keyframes slide {
        0% { left: 50%; top: 50%; height: 37rem; width: 55rem;}

        100% { left: 5%; top: 50%; height: 37rem; width: 3rem;
                box-shadow: 0 1rem 1rem hsla(0, 0%, 0%, 0.068);
        }
}

.gamemenu {
        /* visibility: hidden; */
        position: absolute;
        /* display: flex; */
        left: 5%;
        top: 50%;
        transform: translate(-50%, -50%);
        height: 37rem;
        width: 3rem;
        background-color: #e7b2ff31;
        border-radius: 1rem;
        box-shadow: 0 1rem 1rem hsla(0, 0%, 0%, 0.068);
        backdrop-filter: blur(5px);
        z-index: 3;
        transform-origin: left;
        transition: 200ms ease;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        row-gap: 0.7rem;
        display: none;
}
.gamemenu:hover {
        /* animation-name: slideout; */
        /* animation-duration: 0.6s; */
        /* animation-timing-function: ease; */
        /* transform-origin: left; */
        /* animation-fill-mode: forwards; */
        width: 5rem;
        box-shadow: 0 1rem 1rem hsla(188, 100%, 15%, 0.308);

}

.buttondifficulty {
    position: absolute;
    height: 3rem;
    width: 7rem;
    border-radius: 0.8rem;
    border-width: 0px;
    font-size: 1.1rem;
    font-weight: 200;
    text-align: center;
    justify-content: center;
    align-content: center;
}

.buttonhard {
    top: 55%;
    left: 10%;
    background-color: #e97f96;
    color: white;
    font-weight: 700;
    font-size: 1.35rem;
}
.buttoneasy {
    top: 55%;
    left: 55%;
    background-color: #b1abff;
    color: white;
    font-weight: 700;
    font-size: 1.35rem;
}

.buttoneasy.hide {
        animation-name: hideopacityeasy;
        animation-duration: 1s;
        /* animation-fill-mode: forwards ; */
}
@keyframes hideopacityeasy {
        0%{background-color: #b1abff;}
        50%{opacity: 0;}
        100%{opacity: 0;}
}
.buttonhard.hide {
        animation-name: hideopacityhard;
        animation-duration: 1s;
        /* animation-fill-mode: forwards ; */
}
@keyframes hideopacityhard {
        0%{background-color: #e97f96;}
        50%{opacity: 0;}
        100%{opacity: 0;}
}

#whichturn {
        font-size: 2.2rem;
        position: absolute;
        left: 50%;
        top: 3rem;
        transform: translate(-50%, -50%);
        white-space: nowrap;
        font-family:Arial, Helvetica, sans-serif;
        font-weight: bold;
}

.circleicon {
        height: 2rem;
        width: 2rem;
        border-radius: 1rem;
        opacity: 0;
        text-align: center;
        align-content: center;
        font-weight: bold;
        transition: 0.4s ease;
        color: white;
        user-select: none;
}

.circleicon1 { background-color: rgb(150, 38, 255); color: white; padding-top: 3px;}
.circleicon2 { background-color: chartreuse; color: rgba(255, 255, 255, 0);}
.circleicon3 { background-color: rgb(255, 46, 46); color: rgba(255, 255, 255, 0);}

.circleicon.fade {
        animation-name: fadein;
        animation-duration: 0.6s;
        animation-fill-mode: forwards;
}
@keyframes fadein {
        from {opacity: 0;}
        to {opacity: 1;}
}

body:has(.gamemenu:hover) .circleicon {
        width: 4rem;
        color: white;
}

</style>
